name: Build table-tennis database

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/scan_polymarket_table_tennis.py"
      - "scripts/reconcile_polymarket_players.py"
      - "scripts/review_polymarket_identity_candidates.py"
      - "scripts/verify_polymarket_identity_evidence.py"
      - "tests/test_polymarket_scan.py"
      - "tests/test_polymarket_reconciliation.py"
      - "tests/test_polymarket_identity_review.py"
      - "tests/test_polymarket_identity_evidence.py"
      - "tests/test_datasportsapi_import.py"
      - "scripts/import_datasportsapi.py"
      - "scripts/classify_datasportsapi.py"
      - "tests/test_datasportsapi_import.py"
      - "docs/polymarket_us_integration.md"
      - "docs/domestic_league_coverage.md"
      - "SOURCES.md"
      - ".github/workflows/build-database.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_database.py"
      - "scripts/import_wtt.py"
      - "scripts/analyze_database.py"
      - "scripts/train_prediction_model.py"
      - "scripts/simulate_match.py"
      - "scripts/smoke_test_simulator.py"
      - "scripts/scan_polymarket_table_tennis.py"
      - "scripts/reconcile_polymarket_players.py"
      - "scripts/review_polymarket_identity_candidates.py"
      - "scripts/verify_polymarket_identity_evidence.py"
      - "scripts/import_datasportsapi.py"
      - "scripts/classify_datasportsapi.py"
      - "scripts/analyze_datasportsapi.py"
      - "scripts/audit_datasportsapi_classification.py"
      - "scripts/backtest_datasportsapi.py"
      - "tests/test_polymarket_scan.py"
      - "tests/test_polymarket_reconciliation.py"
      - "tests/test_polymarket_identity_review.py"
      - "tests/test_polymarket_identity_evidence.py"
      - "docs/polymarket_identity_evidence.md"
      - "docs/polymarket_us_integration.md"
      - "docs/domestic_league_coverage.md"
      - ".github/workflows/build-database.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only Polymarket US SDK
        run: python -m pip install --upgrade pip polymarket-us

      - name: Run Polymarket scanner unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Download original sources and build base database
        run: python scripts/build_database.py

      - name: Import WTT men's and women's historical matches
        run: python scripts/import_wtt.py

      - name: Import recent domestic-league results and build source-isolated player histories
        if: github.event_name != 'pull_request'
        env:
          DATASPORTSAPI_KEY: ${{ secrets.DATASPORTSAPI_KEY }}
        run: |
          if [ -z "$DATASPORTSAPI_KEY" ]; then
            echo "::warning::DATASPORTSAPI_KEY is not configured; domestic-league reconciliation will report source_not_loaded."
          else
            python scripts/import_datasportsapi.py
            python scripts/classify_datasportsapi.py
            python scripts/audit_datasportsapi_classification.py
            python scripts/analyze_datasportsapi.py
            python scripts/backtest_datasportsapi.py
          fi

      - name: Audit database and generate chronological WTT features
        run: python scripts/analyze_database.py

      - name: Scan public Polymarket US table-tennis listings and compare player coverage
        run: python scripts/scan_polymarket_table_tennis.py

      - name: Train chronological prediction model and generate backtest
        run: python scripts/train_prediction_model.py

      - name: Reconcile Polymarket players against recent league histories
        run: python scripts/reconcile_polymarket_players.py

      - name: Build manual Polymarket identity review queue
        run: python scripts/review_polymarket_identity_candidates.py

      - name: Build independent identity evidence audit
        run: python scripts/verify_polymarket_identity_evidence.py

      - name: Compile prediction and data scripts
        run: python -m py_compile scripts/verify_polymarket_identity_evidence.py scripts/review_polymarket_identity_candidates.py scripts/train_prediction_model.py scripts/simulate_match.py scripts/smoke_test_simulator.py scripts/scan_polymarket_table_tennis.py scripts/reconcile_polymarket_players.py scripts/review_polymarket_identity_candidates.py scripts/import_datasportsapi.py scripts/classify_datasportsapi.py scripts/analyze_datasportsapi.py scripts/audit_datasportsapi_classification.py scripts/backtest_datasportsapi.py

      - name: Run 100000-simulation smoke test
        run: python scripts/smoke_test_simulator.py

      - name: Upload database, source files, audit reports, Polymarket scan, model, and features
        uses: actions/upload-artifact@v4
        with:
          name: table-tennis-database-build
          path: |
            data/database/table_tennis.sqlite
            data/raw/*.csv
            data/raw/polymarket_us_table_tennis_events.json
            data/processed/database_quality_report.json
            data/processed/wtt_pre_match_features.csv
            data/processed/wtt_enhanced_features.csv
            data/processed/prediction_model.json
            data/processed/current_player_states.json
            data/processed/prediction_backtest_report.json
            data/processed/polymarket_us_events.csv
            data/processed/polymarket_us_markets.csv
            data/processed/polymarket_us_player_coverage.csv
            data/processed/polymarket_us_scan_report.json
            data/raw/datasportsapi/*.json
            data/processed/datasportsapi_player_records.json
            data/processed/datasportsapi_classification_audit.json
            data/processed/datasportsapi_quality_backtest.json
            data/processed/polymarket_datasportsapi_player_coverage.csv
            data/processed/polymarket_datasportsapi_matchup_evidence.csv
            data/processed/polymarket_datasportsapi_reconciliation_report.json
            data/processed/polymarket_identity_review_queue.csv
            data/processed/polymarket_identity_evidence_audit.csv
            data/processed/polymarket_identity_evidence_report.json
          if-no-files-found: error
          retention-days: 30
