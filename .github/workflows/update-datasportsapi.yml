name: Update recent table-tennis results from DataSportsAPI

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/import_datasportsapi.py"
      - "scripts/classify_datasportsapi.py"
      - "scripts/analyze_datasportsapi.py"
      - "scripts/audit_datasportsapi_classification.py"
      - ".github/workflows/update-datasportsapi.yml"
      - "docs/new_source_import_acceptance.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datasportsapi-table-tennis-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only Polymarket US SDK
        run: python -m pip install --upgrade pip polymarket-us

      - name: Rebuild validated historical database
        run: |
          python scripts/build_database.py
          python scripts/import_wtt.py

      - name: Import recent DataSportsAPI table-tennis results
        env:
          DATASPORTSAPI_KEY: ${{ secrets.DATASPORTSAPI_KEY }}
        run: python scripts/import_datasportsapi.py

      - name: Classify singles, doubles, team, and ambiguous fixtures
        run: python scripts/classify_datasportsapi.py

      - name: Audit classification reasons and representative examples
        run: python scripts/audit_datasportsapi_classification.py

      - name: Build individual player records from singles only
        run: python scripts/analyze_datasportsapi.py

      - name: Run DataSportsAPI quality validation and chronological backtest
        run: python scripts/backtest_datasportsapi.py

      - name: Scan active public Polymarket US table-tennis listings
        run: python scripts/scan_polymarket_table_tennis.py

      - name: Reconcile listed players against source-scoped recent match histories
        run: python scripts/reconcile_polymarket_players.py

      - name: Rebuild WTT chronological features and prediction model
        run: |
          python scripts/analyze_database.py
          python scripts/train_prediction_model.py

      - name: Export live matchups and player history for the website
        run: |
          python scripts/export_polymarket_web_data.py
          python scripts/export_web_app.py

      - name: Compile import, classification, analysis, backtest, and web export scripts
        run: python -m py_compile scripts/import_datasportsapi.py scripts/classify_datasportsapi.py scripts/analyze_datasportsapi.py scripts/backtest_datasportsapi.py scripts/audit_datasportsapi_classification.py scripts/scan_polymarket_table_tennis.py scripts/reconcile_polymarket_players.py scripts/export_polymarket_web_data.py

      - name: Persist refreshed daily source snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/datasportsapi/ site/data/polymarket_active.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh retained DataSportsAPI table tennis snapshots"
            # Other workflows may update main while this job runs. Rebase the
            # snapshot commit onto the latest branch before publishing it.
            git pull --rebase origin main
            git push
          fi

      - name: Upload database, provider snapshots, and import evidence
        uses: actions/upload-artifact@v4
        with:
          name: table-tennis-datasportsapi-update
          path: |
            data/database/table_tennis.sqlite
            data/raw/datasportsapi/*.json
            data/processed/datasportsapi_player_records.json
            data/processed/datasportsapi_classification_audit.json
            data/processed/datasportsapi_quality_backtest.json
          if-no-files-found: error
          retention-days: 30

      - name: Add Pages metadata
        run: touch site/.nojekyll

      - name: Upload refreshed simulator website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy refreshed simulator website
        id: deployment
        uses: actions/deploy-pages@v4
